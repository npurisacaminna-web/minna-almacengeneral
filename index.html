<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla con Columna de Ajuste</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        input[type="text"]:disabled { background-color: #e9ecef; border: none; color: #333; }
        button { padding: 6px 12px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .btn-guardar { background-color: #28a745; }
        .btn-guardar:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>Gestión de Registros con Columna de Ajuste</h2>

    <table id="tablaRegistros">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Ajuste</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los registros se cargan dinámicamente -->
        </tbody>
    </table>

    <script>
        // Datos de ejemplo
        let registros = [
            { codigo: "CAT-001", nombre: "Artículo 1", descripcion: "Descripción del artículo uno" },
            { codigo: "CAT-002", nombre: "Artículo 2", descripcion: "Descripción del artículo dos" },
            { codigo: "CAT-003", nombre: "Artículo 3", descripcion: "Descripción del artículo tres" }
        ];

        function renderTabla() {
            const tbody = document.querySelector("#tablaRegistros tbody");
            tbody.innerHTML = "";
            
            registros.forEach((reg, index) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><input type="text" value="${reg.codigo}" id="codigo-${index}" disabled></td>
                    <td><input type="text" value="${reg.nombre}" id="nombre-${index}" disabled></td>
                    <td><input type="text" value="${reg.descripcion}" id="desc-${index}" disabled></td>
                    <td>
                        <button id="btn-${index}" onclick="toggleEditar(${index})">Editar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleEditar(index) {
            const btn = document.getElementById(`btn-${index}`);
            const codigoInput = document.getElementById(`codigo-${index}`);
            const nombreInput = document.getElementById(`nombre-${index}`);
            const descInput = document.getElementById(`desc-${index}`);

            const isEditing = btn.textContent === "Guardar";

            if (isEditing) {
                // Guardar los cambios en el array de datos
                registros[index].codigo = codigoInput.value;
                registros[index].nombre = nombreInput.value;
                registros[index].descripcion = descInput.value;

                // Deshabilitar campos y cambiar botón
                codigoInput.disabled = true;
                nombreInput.disabled = true;
                descInput.disabled = true;
                btn.textContent = "Editar";
                btn.classList.remove("btn-guardar");

                console.log("Registro actualizado:", registros[index]);
            } else {
                // Habilitar campos para edición
                codigoInput.disabled = false;
                nombreInput.disabled = false;
                descInput.disabled = false;
                btn.textContent = "Guardar";
                btn.classList.add("btn-guardar");
                codigoInput.focus();
            }
        }

        // Inicializar la tabla al cargar la página
        renderTabla();
    </script>

</body>
</html>
